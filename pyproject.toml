[project]
name = "unlisted"
version = "0.1.0"
description = "Local-first CLI for removing your personal info from data broker sites."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "keyring>=25",
    "platformdirs>=4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
unlisted = "unlisted.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unlisted"]

[tool.ruff]
line-length = 100
src = ["src", "."]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
